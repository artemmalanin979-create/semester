{% extends 'base.html' %}
{% from 'components.html' import icon %}
{% block title %}{{ title }} · Семестр{% endblock %}
{% block content %}
<section class="surface detail-panel error-panel">
  <p class="num error-code">Ошибка {{ status }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for(home_endpoint if g.student else 'login') }}"><span>Вернуться в кабинет</span>{{ icon('arrow', 16) }}</a>
</section>
{% endblock %}
